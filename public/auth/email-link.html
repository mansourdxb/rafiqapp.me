<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>رفيق المسلم — تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Cairo',sans-serif;background:#FBF8F3;color:#1A1612;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
.card{max-width:420px;width:100%}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:22px;color:#1A3C2A;margin:16px 0 6px}
p{font-size:15px;color:#5C5248;margin:4px 0}
.en{direction:ltr}
a.btn{display:inline-block;margin-top:22px;background:#2F6E52;color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:14px 28px;border-radius:14px}
</style>
</head>
<body>
<div class="card">
  <img src="/logo.png" alt="">
  <h1>رفيق المسلم</h1>
  <p>جارٍ فتح التطبيق لإكمال تسجيل الدخول…</p>
  <p class="en">Opening the app to finish signing in…</p>
  <a class="btn" id="open" href="#">فتح التطبيق · Open the app</a>
  <p style="margin-top:18px;font-size:13px">افتح هذا الرابط على الهاتف المثبّت عليه التطبيق.</p>
  <p class="en" style="font-size:13px">Open this link on the phone that has the app.</p>
</div>
<script>
(function () {
  // This page is the Firebase email action URL. Only sign-in links go to the app; password reset
  // and email verification keep using Firebase's own page.
  var mode = new URLSearchParams(location.search).get("mode");
  if (mode && mode !== "signIn") {
    location.replace("https://rafiq-al-muslim-500506.firebaseapp.com/__/auth/action" + location.search);
    return;
  }
  // Hand the whole Firebase sign-in link (mode, oobCode, …) to the app; nothing is stored or sent elsewhere.
  var link = encodeURIComponent(location.href);
  var android = /android/i.test(navigator.userAgent);
  var url = android
    ? "intent://email-link?link=" + link + "#Intent;scheme=rafiq-al-muslim;end"
    : "rafiq-al-muslim://email-link?link=" + link;
  document.getElementById("open").href = url;
  location.href = url;
})();
</script>
</body>
</html>
