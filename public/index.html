<link rel="icon" href="/logo.png">
<script>
  // Opens the site in the saved language, else the browser's, else Arabic.
  (function () {
    if (location.protocol === "http:" && !/^(localhost|127\.|192\.168\.)/.test(location.hostname)) {
      location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      return;
    }
    var langs = ["ar", "en", "ur", "fa", "ru", "ms", "tr", "id", "hi", "bn", "ha", "fr", "zh"];
    var pick = null;
    try { pick = localStorage.getItem("lang"); } catch (e) {}
    if (langs.indexOf(pick) < 0) {
      var nav = (navigator.languages || [navigator.language || ""]);
      for (var i = 0; i < nav.length && !pick; i++) {
        var c = String(nav[i]).slice(0, 2).toLowerCase();
        if (langs.indexOf(c) >= 0) pick = c;
      }
    }
    if (langs.indexOf(pick) < 0) pick = "ar";
    location.replace("/" + pick + "/" + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/ar/"></noscript>
</head>
